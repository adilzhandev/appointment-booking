spring:
  application:
    name: appointment-booking

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/appointment_db}
    username: ${DB_USERNAME:appointment}
    password: ${DB_PASSWORD:appointment}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: Asia/Almaty
        format_sql: true
        default_batch_fetch_size: 32

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

app:
  jwt:
    # В проде задаётся переменной окружения JWT_SECRET; значение по умолчанию — только для локальной разработки.
    secret: ${JWT_SECRET:local-dev-secret-change-me-please-32-bytes-min}
    expiration-seconds: ${JWT_EXPIRATION:3600}
    issuer: rcez-appointment
  seed:
    enabled: ${SEED_ENABLED:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    kz.rcez.appointment: INFO
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}
